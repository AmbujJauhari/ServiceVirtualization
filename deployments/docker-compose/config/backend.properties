# =============================================================================
# Service Virtualization Platform — Backend Configuration (On-Prem Docker)
# =============================================================================
#
# This file is mounted into the backend container at startup.
# All broker hostnames match the Docker Compose service names so they resolve
# automatically within the sv-net bridge network.
#
# To connect to external brokers instead of the bundled containers, update the
# relevant host/URL values and remove that service from COMPOSE_PROFILES in .env.
#
# No SSL — all connections use plain TCP/PLAINTEXT.
# =============================================================================

# -----------------------------------------------------------------------------
# Sybase DataSource excluded (MongoDB only)
# -----------------------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

# -----------------------------------------------------------------------------
# MongoDB
# Update the URI here if using an external MongoDB instance.
# -----------------------------------------------------------------------------
spring.data.mongodb.uri=mongodb://mongodb:27017
spring.data.mongodb.database=service_virtualization

# -----------------------------------------------------------------------------
# WireMock — embedded REST/SOAP engine
# -----------------------------------------------------------------------------
wiremock.server.host=localhost
wiremock.server.port=8081

# -----------------------------------------------------------------------------
# HTTP Proxy timeouts
# -----------------------------------------------------------------------------
proxy.connect-timeout=5000
proxy.timeout=30000
proxy.logging.enabled=true

# -----------------------------------------------------------------------------
# Kafka — PLAINTEXT, no SSL
# Cluster name "default" maps to the bundled cp-kafka container.
# Add more clusters with additional kafka.registry.<name>.* blocks.
# -----------------------------------------------------------------------------
kafka.registry.default.bootstrap.servers=kafka:9092
kafka.registry.default.consumer.group.id=sv-default
kafka.registry.default.ssl.enabled=false

# -----------------------------------------------------------------------------
# IBM MQ — plain TCP, no SSL
# DEV.APP.SVRCONN is the default non-SSL channel created by the IBM MQ
# developer container. Username/password match MQ_APP_PASSWORD in docker-compose.yml.
# -----------------------------------------------------------------------------
ibmmq.registry.default.host=ibmmq
ibmmq.registry.default.port=1414
ibmmq.registry.default.queue.manager=QM1
ibmmq.registry.default.channel=DEV.APP.SVRCONN
ibmmq.registry.default.username=app
ibmmq.registry.default.password=passw0rd
ibmmq.registry.default.ssl.enabled=false

# -----------------------------------------------------------------------------
# TIBCO EMS — plain TCP, no SSL
# Default admin credentials for the kytay/tibco-ems community image.
# -----------------------------------------------------------------------------
tibco.registry.default.url=tcp://tibco:7222
tibco.registry.default.username=admin
tibco.registry.default.password=admin
tibco.registry.default.enabled=true

# -----------------------------------------------------------------------------
# ActiveMQ — plain TCP, no SSL
# Default admin credentials for the rmohr/activemq community image.
# -----------------------------------------------------------------------------
activemq.registry.default.broker.url=tcp://activemq:61616
activemq.registry.default.username=admin
activemq.registry.default.password=admin

# -----------------------------------------------------------------------------
# File Virtualization
# -----------------------------------------------------------------------------
virtualization.files.output.directory=/tmp/sv-files
virtualization.files.scheduler.enabled=false
virtualization.files.scheduler.poll-rate=0
