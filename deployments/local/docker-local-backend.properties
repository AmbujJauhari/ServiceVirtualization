# =============================================================================
# Local Docker — Backend Configuration
# =============================================================================
#
# Used when running the backend container locally with --network host.
# All messaging protocols are disabled via profiles; only MongoDB and WireMock
# are required.
#
# Run command:
#   docker run --rm --network host \
#     -v "<absolute-path>:/app/config/application.properties" \
#     -e SPRING_PROFILES_ACTIVE="docker,mongodb,kafka-disabled,ibmmq-disabled,tibco-disabled,activemq-disabled" \
#     -e JAVA_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0" \
#     service-virtualization-backend:latest
# =============================================================================

# Disable Sybase DataSource auto-config (not needed locally)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

# MongoDB — pointing to host-local MongoDB (sv-mongodb container on host network)
spring.data.mongodb.uri=mongodb://sv-mongodb:27017
spring.data.mongodb.database=service_virtualization

# WireMock — embedded REST/SOAP engine
wiremock.server.host=localhost
wiremock.server.port=8081

# HTTP Proxy timeouts
proxy.connect-timeout=5000
proxy.timeout=30000
proxy.logging.enabled=true

# File Virtualization
virtualization.files.output.directory=/tmp/sv-files
virtualization.files.scheduler.enabled=false
virtualization.files.scheduler.poll-rate=0
