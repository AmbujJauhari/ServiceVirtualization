# =============================================================================
# Margin Team — Backend Application Configuration
# =============================================================================
#
# This file is the single source of truth for all operational configuration
# for the margin team's backend pod.
#
# How it is used:
#   Kubernetes  — the Helm chart creates a ConfigMap from this content and
#                 mounts it at /app/config/application.properties inside the
#                 pod.  Spring Boot auto-discovers /app/config/ at startup.
#
#   Local Docker — mount directly:
#     docker run \
#       -v "<absolute-path-to-this-file>:/app/config/application.properties" \
#       -e SPRING_PROFILES_ACTIVE="docker,mongodb,activemq-disabled" \
#       -e JAVA_OPTS="..." \
#       -p 8080:8080 \
#       service-virtualization-backend:latest
#
# NOTE: SPRING_PROFILES_ACTIVE and JAVA_OPTS must be passed as env vars.
#   - Spring profiles are resolved before external config files are read.
#   - JAVA_OPTS is consumed by the JVM launcher before Spring starts.
#
# All property keys use Spring canonical format (lowercase dot-notation) so
# that environment.getProperty("some.key") and @Value("${some.key}") resolve
# them correctly from a mounted properties file.
# =============================================================================

# -----------------------------------------------------------------------------
# Spring Auto-configuration Exclusions
# Margin team uses MongoDB only — disable Sybase DataSource auto-config.
# -----------------------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

# -----------------------------------------------------------------------------
# MongoDB
# Keys must match what Spring Boot's MongoAutoConfiguration binds to.
# -----------------------------------------------------------------------------
spring.data.mongodb.uri=mongodb://margin-mongodb.margin.svc.cluster.local:27017
spring.data.mongodb.database=service_virtualization

# -----------------------------------------------------------------------------
# WireMock — embedded REST/SOAP stub engine (always localhost inside the pod)
# -----------------------------------------------------------------------------
wiremock.server.host=localhost
wiremock.server.port=8081

# -----------------------------------------------------------------------------
# HTTP Proxy (RestTemplate timeouts)
# -----------------------------------------------------------------------------
proxy.connect-timeout=5000
proxy.timeout=30000
proxy.logging.enabled=true

# -----------------------------------------------------------------------------
# Kafka Registry — multi-cluster configuration
# Keys follow the pattern: kafka.registry.<clusterName>.<property>
# Discovered by KafkaServerRegistry via environment.getProperty("kafka.registry.*")
# PLAINTEXT (port 9092) — SSL hostname (*.service-virtualization.local) is not
# resolvable inside the cluster.
# -----------------------------------------------------------------------------
kafka.registry.events.bootstrap.servers=margin-service-virtualization-kafka-events.margin.svc.cluster.local:9092
kafka.registry.events.consumer.group.id=sv-margin-events
kafka.registry.events.ssl.enabled=false

kafka.registry.analytics.bootstrap.servers=margin-service-virtualization-kafka-analytics.margin.svc.cluster.local:9092
kafka.registry.analytics.consumer.group.id=sv-margin-analytics
kafka.registry.analytics.ssl.enabled=false

# -----------------------------------------------------------------------------
# IBM MQ Registry — multi-server configuration
# Keys follow the pattern: ibmmq.registry.<serverName>.<property>
# Discovered by IbmMqServerRegistry via environment.getProperty("ibmmq.registry.*")
# Backend connects inside the cluster (ClusterIP). TLS required (SSLCIPH on channel).
# Service name: <release>-mq-<instanceName>
# -----------------------------------------------------------------------------
ibmmq.registry.icg.host=margin-mq-icg.margin.svc.cluster.local
ibmmq.registry.icg.port=1414
ibmmq.registry.icg.queue.manager=QM_ICG
ibmmq.registry.icg.channel=MARGIN.ICG.SVRCONN
ibmmq.registry.icg.ssl.enabled=true
ibmmq.registry.icg.ssl.cipher.suite=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

ibmmq.registry.rto.host=margin-mq-rto.margin.svc.cluster.local
ibmmq.registry.rto.port=1414
ibmmq.registry.rto.queue.manager=QM_RTO
ibmmq.registry.rto.channel=MARGIN.RTO.SVRCONN
ibmmq.registry.rto.ssl.enabled=true
ibmmq.registry.rto.ssl.cipher.suite=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

# -----------------------------------------------------------------------------
# TIBCO Registry — multi-server configuration
# Keys follow the pattern: tibco.registry.<serverName>.<property>
# Discovered by TibcoServerRegistry via environment.getProperty("tibco.registry.*")
# Backend connects via TCP (plain, port 7222). SSL port 7243 is for external clients.
# Service name: <release>-service-virtualization-tibco-<instanceName>
# -----------------------------------------------------------------------------
tibco.registry.servera.url=tcp://margin-service-virtualization-tibco-serverA.margin.svc.cluster.local:7222
tibco.registry.servera.username=admin
tibco.registry.servera.password=admin
tibco.registry.servera.enabled=true

tibco.registry.serverb.url=tcp://margin-service-virtualization-tibco-serverB.margin.svc.cluster.local:7222
tibco.registry.serverb.username=admin
tibco.registry.serverb.password=admin
tibco.registry.serverb.enabled=true

# -----------------------------------------------------------------------------
# File Virtualization Service
# -----------------------------------------------------------------------------
virtualization.files.output.directory=/tmp/sv-files
virtualization.files.scheduler.enabled=false
virtualization.files.scheduler.poll-rate=0

# -----------------------------------------------------------------------------
# Schema Registry (optional — only set when stubs use Avro/Protobuf schemas)
# Uncomment and configure when enabling schema validation:
# -----------------------------------------------------------------------------
# schema.registry.url=http://margin-service-virtualization-kafka-events-schema-registry.margin.svc.cluster.local:8081
# schema.registry.auth.type=none
