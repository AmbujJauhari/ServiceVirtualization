# =============================================================================
# Margin Team — MongoDB (Optional Service)
# =============================================================================
# MongoDB is optional — teams with an existing MongoDB, Azure Cosmos DB, or
# Sybase should set sv.mongodb.enabled: false and update MONGODB_URI in
# backend.yaml to point at their external instance.
#
# nameOverride pins the service name to "margin-mongodb" regardless of the
# Helm release name, ensuring MONGODB_URI in backend.yaml never breaks.
#
# No Istio networking resources are needed for MongoDB — it is cluster-internal
# and accessed directly by the backend via ClusterIP service DNS.
# =============================================================================

sv:
  mongodb:
    enabled: true

    # Pins the Kubernetes Service name to "margin-mongodb".
    # Must match MONGODB_URI in backend.yaml:
    #   mongodb://margin-mongodb.margin.svc.cluster.local:27017
    nameOverride: "margin-mongodb"

    image:
      repository: "mongo"
      tag: "7.0"
      pullPolicy: "IfNotPresent"

    replicaCount: 1

    service:
      port: 27017

    # Disabled for local dev; enable with credentials for AKS/production:
    #   auth:
    #     enabled: true
    #     rootUsername: "admin"
    #     rootPassword: "changeme"
    #     database: "service_virtualization"
    auth:
      enabled: false

    # emptyDir by default (data lost on pod restart — fine for local dev).
    # Enable PVC for environments that require persistence:
    #   storage:
    #     enabled: true
    #     size: "2Gi"
    #     storageClass: ""   # blank = cluster default
    storage:
      enabled: false

    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

    healthCheck:
      livenessInitialDelay: 30
      livenessPeriod: 30
      livenessTimeout: 10
      livenessFailureThreshold: 3
      readinessInitialDelay: 10
      readinessPeriod: 10
      readinessTimeout: 5
      readinessFailureThreshold: 3

    # ---------------------------------------------------------------------------
    # Mongo Express — browser-based MongoDB admin UI
    # Host-based routing (consistent with Control Center) — no URI rewrite needed.
    # DNS required: mongo.margin.service-virtualization.local → <vm-bridged-ip>
    # Access: http://mongo.margin.service-virtualization.local:30099
    # ---------------------------------------------------------------------------
    mongoExpress:
      enabled: true
      image:
        repository: "mongo-express"
        tag: "1.0.2"
        pullPolicy: "IfNotPresent"
      # Basic auth — disabled for local dev. Enable for shared/production envs:
      #   basicAuth:
      #     enabled: true
      #     username: "admin"
      #     password: "changeme"
      basicAuth:
        enabled: false
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"

# =============================================================================
# Networking: Istio VirtualService for Mongo Express UI (host-based)
# MongoDB itself needs no VS — it is cluster-internal only.
# =============================================================================
networking:
  mongodb:
    mongoExpress:
      enabled: true
      hostname: "mongo.margin.service-virtualization.local"
