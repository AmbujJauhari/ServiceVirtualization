# =============================================================================
# Margin Team — IBM MQ RTO Instance
# =============================================================================
# Enables:
#   sv.ibmmq.instances.rto       — deploys the IBM MQ RTO pod + service
#   networking.ibmmq.instances.rto — creates TLS VS + console VS + DR
#
# IBM MQ channel name: MARGIN.RTO.SVRCONN
# Derived SNI: margin2e-rto2e-svrconn.chl.mq.ibm.com
#
# DNS required:
#   margin2e-rto2e-svrconn.chl.mq.ibm.com  → <ingress-gateway-ip>
#   rto.ibmmq.margin.service-virtualization.local → <ingress-gateway-ip>
# =============================================================================

sv:
  ibmmq:
    enabled: true
    instances:
      rto:
        image:
          repository: "icr.io/ibm-messaging/mq"
          tag: "9.3.0.0-r1"
          pullPolicy: "IfNotPresent"
        replicaCount: 1
        service:
          type: "ClusterIP"
          port: 1414
        license: "accept"
        queueManager:
          name: "QM_RTO"

        certificates:
          enabled: true
          volumeName: mq-pki-rto

        extraVolumes:
          - name: margin-tls-secret
            secret:
              secretName: margin-tls-secret
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key

        config:
          default:
            enabled: false
          custom:
            mqsc: |
              * =================================================================
              * RTO Instance — Custom MQSC Configuration (Margin Team)
              * =================================================================
              * default.enabled=false so this file is the complete MQSC.
              * SSLCIPH must be set here explicitly (the Helm template only
              * auto-generates it in the default.enabled=true path).
              * =================================================================

              * Unique channel for Istio SNI routing.
              * MARGIN.RTO.SVRCONN → SNI: margin2e-rto2e-svrconn.chl.mq.ibm.com
              DEFINE CHANNEL('MARGIN.RTO.SVRCONN') CHLTYPE(SVRCONN) TRPTYPE(TCP) SSLCIPH(ECDHE_RSA_AES_256_GCM_SHA384) SSLCAUTH(OPTIONAL) MCAUSER('app') REPLACE

              SET CHLAUTH('MARGIN.RTO.SVRCONN') TYPE(ADDRESSMAP) ADDRESS('*') USERSRC(CHANNEL) CHCKCLNT(ASQMGR)

              DEFINE QLOCAL('RTO.QUEUE.1') REPLACE

              ALTER AUTHINFO('DEV.AUTHINFO') AUTHTYPE(IDPWOS) CHCKCLNT(NONE) ADOPTCTX(NO)
              REFRESH SECURITY(*) TYPE(CONNAUTH)
          initContainers:
            - name: cert-provider
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  cp /mnt/wildcard/tls.crt /etc/mqm/pki/keys/default/tls.crt
                  cp /mnt/wildcard/tls.key /etc/mqm/pki/keys/default/tls.key
                  chmod 644 /etc/mqm/pki/keys/default/tls.crt
                  chmod 644 /etc/mqm/pki/keys/default/tls.key
              volumeMounts:
                - name: mq-pki-rto
                  mountPath: /etc/mqm/pki/keys/default
                - name: margin-tls-secret
                  mountPath: /mnt/wildcard
                  readOnly: true

        healthCheck:
          livenessInitialDelay: 90
          livenessTimeout: 5
          livenessPeriod: 30
          livenessFailureThreshold: 3
          readinessInitialDelay: 30
          readinessTimeout: 5
          readinessPeriod: 10
          readinessFailureThreshold: 3
          startupInitialDelay: 10
          startupTimeout: 5
          startupPeriod: 10
          startupFailureThreshold: 30

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

# =============================================================================
# Networking: Istio resources for IBM MQ RTO
# =============================================================================

networking:
  ibmmq:
    instances:
      rto:
        enabled: true
        sniHost: "margin2e-rto2e-svrconn.chl.mq.ibm.com"
        consoleHost: "rto.ibmmq.margin.service-virtualization.local"
