# =============================================================================
# Tibco EMS TLS Integration Test Configuration
# =============================================================================
# Architecture: TLS PASSTHROUGH via Istio
#   Client → TLS → Istio gateway (reads SNI from ssl:// hostname, no decrypt)
#                → Tibco EMS pod:7243 → pod terminates TLS end-to-end
#
# The Tibco EMS pod uses the wildcard cert (*.service-virtualization.local)
# mounted from margin-tls-secret / collateral-tls-secret via an init container.
# The client truststore must contain that wildcard cert.
#
# For local K3s testing (hosts file on Windows — C:\Windows\System32\drivers\etc\hosts):
#   192.168.1.88  servera.tibco.margin.service-virtualization.local
#   192.168.1.88  serverb.tibco.margin.service-virtualization.local
#   192.168.1.88  servera.tibco.collateral.service-virtualization.local
#
# truststore.jks is PRE-BUILT and COMMITTED to this repo.
# It contains the wildcard cert from deployments/local/cluster-admin/wildcard.crt.
# Build / rebuild it with:
#   keytool -import -file deployments/local/cluster-admin/wildcard.crt \
#     -alias wildcard-tibco \
#     -keystore test/tibco-tls-test/src/test/resources/certs/truststore.jks \
#     -storepass changeit -noprompt
#
# For AKS:
#   - Replace .local hostnames with real DNS names
#   - Replace port with the cloud load balancer port (443)
#   - Point truststore to your corporate CA truststore
# =============================================================================

# -----------------------------------------------------------------------------
# Margin Team — Tibco EMS Server A (serviceA)
# -----------------------------------------------------------------------------
margin.servera.tibco.host=servera.tibco.margin.service-virtualization.local
margin.servera.tibco.port=30501
margin.servera.tibco.username=admin
margin.servera.tibco.password=admin
margin.servera.tibco.queue=test.queue
margin.servera.tibco.topic=test.topic

# -----------------------------------------------------------------------------
# Margin Team — Tibco EMS Server B (serviceB)
# -----------------------------------------------------------------------------
margin.serverb.tibco.host=serverb.tibco.margin.service-virtualization.local
margin.serverb.tibco.port=30501
margin.serverb.tibco.username=admin
margin.serverb.tibco.password=admin
margin.serverb.tibco.queue=test.queue
margin.serverb.tibco.topic=test.topic

# -----------------------------------------------------------------------------
# TLS Configuration
# -----------------------------------------------------------------------------
ssl.trustStorePath=src/test/resources/certs/truststore.jks
ssl.trustStorePassword=changeit

# -----------------------------------------------------------------------------
# Test Timeouts (milliseconds)
# -----------------------------------------------------------------------------
test.connectionTimeout=10000
test.messageTimeout=5000
