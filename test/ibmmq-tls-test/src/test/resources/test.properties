# =============================================================================
# IBM MQ TLS Integration Test Configuration
# =============================================================================
# Architecture: TLS PASSTHROUGH via Istio
#   Client → TLS(ECDHE-RSA-AES256-GCM-SHA384) → Istio gateway (reads SNI, no decrypt)
#           → pod:1414 → IBM MQ pod terminates TLS end-to-end
#
# The IBM MQ pod uses its auto-generated self-signed certificate.
# The client truststore must contain that cert (NOT the Istio wildcard cert).
#
# For local K3s testing (hosts file on Windows — C:\Windows\System32\drivers\etc\hosts):
#   192.168.1.79  icg.ibmmq.margin.service-virtualization.local
#   192.168.1.79  rto.ibmmq.margin.service-virtualization.local
#
# truststore.jks is PRE-BUILT and COMMITTED to this repo.
# It contains the wildcard cert from deployments/local/cluster-admin/wildcard.crt.
# All IBM MQ pods are configured to present this same cert (mounted via the
# mq-tls-secret Kubernetes Secret in each namespace).
#
# No kubectl cert-extraction steps needed for developers.
#
# If you ever need to rebuild it (e.g. after wildcard cert rotation):
#   keytool -import -file deployments/local/cluster-admin/wildcard.crt \
#     -alias wildcard-mq \
#     -keystore test/ibmmq-tls-test/src/test/resources/certs/truststore.jks \
#     -storepass changeit -noprompt
#
# For AKS:
#   - Replace .local hostnames with real DNS names
#   - Replace port with the cloud load balancer port (443)
#   - Point truststore to your corporate CA truststore
# =============================================================================

# -----------------------------------------------------------------------------
# Margin Team — IBM MQ ICG Instance
# -----------------------------------------------------------------------------
margin.mq.host=icg.ibmmq.margin.service-virtualization.local
margin.mq.port=30501
margin.mq.channel=MARGIN.ICG.SVRCONN
margin.mq.queueManager=QM_ICG
margin.mq.queue=DEV.QUEUE.1

# -----------------------------------------------------------------------------
# "Collateral" slot — mapped to RTO instance for local testing
# (No separate collateral namespace in local K3s; RTO serves as the second
#  distinct queue manager for isolation and SNI routing tests.)
# -----------------------------------------------------------------------------
collateral.mq.host=rto.ibmmq.margin.service-virtualization.local
collateral.mq.port=32262
collateral.mq.channel=DEV.APP.SVRCONN
collateral.mq.queueManager=QM_RTO
collateral.mq.queue=RTO.QUEUE.1

# -----------------------------------------------------------------------------
# TLS Configuration
# -----------------------------------------------------------------------------
# Cipher suite must match DEV.APP.SVRCONN SSLCIPH in the IBM MQ pod MQSC.
# TLS_RSA_* cipher suites are not supported by Envoy's BoringSSL; use ECDHE.
ssl.cipherSuite=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

# Truststore containing the self-signed certs of the IBM MQ pods (ICG + RTO).
# Build with the keytool commands in the header above.
ssl.trustStorePath=src/test/resources/certs/truststore.jks
ssl.trustStorePassword=changeit

# -----------------------------------------------------------------------------
# Test Timeouts (milliseconds)
# -----------------------------------------------------------------------------
test.connectionTimeout=10000
test.messageTimeout=5000
