# =============================================================================
# Kafka TLS Integration Test Configuration
# =============================================================================
# Architecture: TLS PASSTHROUGH via Istio
#   Client → SSL → Istio gateway (reads SNI from bootstrap host, no decrypt)
#               → Kafka pod:9094 → pod terminates SSL end-to-end
#
# The Kafka broker advertises its SSL listener as:
#   SSL://events.kafka.margin.service-virtualization.local:30501
# (externalPort in kafka-events.yaml is set to 30501 for local K3s).
# This ensures clients reconnect after bootstrap on the same NodePort,
# not on port 443 which is not the NodePort.
#
# The Kafka pod uses the wildcard cert (*.service-virtualization.local)
# from margin-tls-secret, converted to JKS format by the cert-converter
# init container. The client truststore must contain this wildcard cert.
#
# For local K3s testing (hosts file on Windows — C:\Windows\System32\drivers\etc\hosts):
#   192.168.1.88  events.kafka.margin.service-virtualization.local
#   192.168.1.88  events.kafka.collateral.service-virtualization.local
#
# truststore.jks is PRE-BUILT and COMMITTED to this repo.
# It contains the wildcard cert from deployments/local/cluster-admin/wildcard.crt.
# Build / rebuild it with:
#   keytool -import -file deployments/local/cluster-admin/wildcard.crt \
#     -alias wildcard-kafka \
#     -keystore test/kafka-tls-test/src/test/resources/certs/truststore.jks \
#     -storepass changeit -noprompt
#
# For AKS:
#   - Replace .local hostnames with real DNS names
#   - Replace port with the cloud load balancer port (443)
#   - Update ssl.truststore.location to your corporate CA truststore
# =============================================================================

# -----------------------------------------------------------------------------
# Margin Team — Kafka Events Instance
# -----------------------------------------------------------------------------
margin.events.kafka.bootstrapServers=events.kafka.margin.service-virtualization.local:30501
margin.events.kafka.topic=test-topic
# Consumer group unique per test run to avoid offset conflicts across test suites
margin.events.kafka.consumerGroup=sv-test-group-margin

# -----------------------------------------------------------------------------
# Collateral Team — Kafka Events Instance
# -----------------------------------------------------------------------------
collateral.events.kafka.bootstrapServers=events.kafka.collateral.service-virtualization.local:30501
collateral.events.kafka.topic=test-topic
collateral.events.kafka.consumerGroup=sv-test-group-collateral

# -----------------------------------------------------------------------------
# TLS / SSL Configuration
# -----------------------------------------------------------------------------
ssl.truststore.location=src/test/resources/certs/truststore.jks
ssl.truststore.password=changeit
# Disable hostname verification — wildcard cert does not cover multi-level subdomains.
# For production set ssl.endpoint.identification.algorithm=HTTPS (the default).
ssl.endpoint.identification.algorithm=

# -----------------------------------------------------------------------------
# Test Timeouts (milliseconds)
# -----------------------------------------------------------------------------
test.connectionTimeout=10000
# How long to wait for consumer to receive each message
test.pollTimeout=10000
# Max time for a producer.send() to complete
test.producerTimeout=10000
