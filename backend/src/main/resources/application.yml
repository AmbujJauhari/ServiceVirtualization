spring:
  application:
    name: service-virtualization
  profiles:
    # Default profile activates MongoDB repository implementations.
    # Teams override this via SPRING_PROFILES_ACTIVE env var or spring.profiles.active
    # in their mounted /app/config/application.properties.
    default: mongodb
  datasource:
    # Driver class name kept here so the Sybase JPA auto-configuration can reference it.
    # Teams that do NOT use Sybase must exclude DataSource auto-configuration:
    #   spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,...
    driver-class-name: com.sybase.jdbc4.jdbc.SybDriver

server:
  port: 8080
  servlet:
    context-path: /

# Database selector — controls which repository implementation is chosen at runtime.
database:
  primary: mongodb

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging — sensible product defaults; teams may override in their properties file.
logging:
  level:
    root: INFO
    com.service.virtualization: DEBUG
    org.wiremock: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true
    jms:
      enabled: false
